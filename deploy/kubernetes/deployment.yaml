apiVersion: apps/v1
kind: Deployment
metadata:
  name: ironroot
  labels:
    app.kubernetes.io/name: ironroot
    app.kubernetes.io/component: pki-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ironroot
      app.kubernetes.io/component: pki-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ironroot
        app.kubernetes.io/component: pki-server
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/ironroot/ironroot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: IRONROOT_CONFIG
              value: /config/config.yaml
            - name: OTEL_SERVICE_NAME
              value: ironroot-server
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.observability.svc:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: ca
              mountPath: /pki
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ironroot-config
        - name: data
          persistentVolumeClaim:
            claimName: ironroot-data
        - name: ca
          secret:
            secretName: ironroot-ca

