apiVersion: v1
kind: ConfigMap
metadata:
  name: ironroot-config
  labels:
    app.kubernetes.io/name: ironroot
    app.kubernetes.io/component: pki-server
data:
  config.yaml: |
    server:
      address: ":8443"
      tls:
        cert_file: ""
        key_file: ""
    database:
      driver: sqlite
      dsn: "file:/data/ironroot.db?_foreign_keys=on"
    pki:
      root_file: /pki/root-ca.crt
      chain_file: /pki/ca-chain.crt
      intermediate_cert_file: /pki/intermediate.crt
      intermediate_key_file: /pki/intermediate.key
      default_lifetime: 2160h
      renew_before: 720h
    telemetry:
      enabled: true
      service_name: ironroot-server
      service_version: 0.1.0
      deployment_environment: kubernetes
      otlp_endpoint: opentelemetry-collector.observability.svc:4317
      otlp_protocol: grpc
      sampling_ratio: 1.0
    log:
      level: info

