config:
  telemetry:
    enabled: true
    endpoint: opentelemetry-collector.observability.svc:4317
    protocol: grpc
    serviceName: ironroot
    environment: production
    samplingRatio: 0.25
    resourceAttributes: "deployment.environment=production,service.namespace=pki"
    prometheus:
      enabled: true
      path: /metrics

serviceMonitor:
  enabled: true

pki:
  existingSecret: ironroot-ca

tls:
  existingSecret: ironroot-api-tls
