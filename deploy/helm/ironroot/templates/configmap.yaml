apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ironroot.fullname" . }}-config
  labels:
    {{- include "ironroot.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      address: ":{{ .Values.server.port }}"
      tls:
        cert_file: {{ ternary "/tls/tls.crt" "" .Values.tls.enabled | quote }}
        key_file: {{ ternary "/tls/tls.key" "" .Values.tls.enabled | quote }}
    database:
      driver: {{ .Values.config.database.type | quote }}
      dsn: {{ include "ironroot.databaseDSN" . | quote }}
    pki:
      root_file: {{ printf "%s/root-ca.crt" .Values.pki.mountPath | quote }}
      chain_file: {{ printf "%s/ca-chain.crt" .Values.pki.mountPath | quote }}
      intermediate_cert_file: {{ printf "%s/intermediate.crt" .Values.pki.mountPath | quote }}
      intermediate_key_file: {{ printf "%s/intermediate.key" .Values.pki.mountPath | quote }}
      intermediate_key_pass: {{ .Values.pki.intermediateKeyPass | quote }}
      default_lifetime: 2160h
      renew_before: 720h
    telemetry:
      enabled: {{ .Values.config.telemetry.enabled }}
      service_name: {{ .Values.config.telemetry.serviceName | quote }}
      service_version: {{ default .Chart.AppVersion .Values.config.telemetry.serviceVersion | quote }}
      deployment_environment: {{ .Values.config.telemetry.environment | quote }}
      otlp_endpoint: {{ .Values.config.telemetry.endpoint | quote }}
      otlp_protocol: {{ .Values.config.telemetry.protocol | quote }}
      sampling_ratio: {{ .Values.config.telemetry.samplingRatio }}
      traces:
        enabled: {{ .Values.config.telemetry.traces.enabled }}
      metrics:
        enabled: {{ .Values.config.telemetry.metrics.enabled }}
      logs:
        enabled: {{ .Values.config.telemetry.logs.enabled }}
      exporter:
        protocol: {{ .Values.config.telemetry.protocol | quote }}
        endpoint: {{ .Values.config.telemetry.endpoint | quote }}
        insecure: true
      sampling:
        ratio: {{ .Values.config.telemetry.samplingRatio }}
      prometheus:
        enabled: {{ .Values.config.telemetry.prometheus.enabled }}
        path: {{ .Values.config.telemetry.prometheus.path | quote }}
    log:
      level: {{ .Values.config.logLevel | quote }}
