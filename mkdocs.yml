site_name: IronRoot
site_description: Airgap-first trust infrastructure
repo_url: https://github.com/ironroot/ironroot
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
plugins:
  - search
nav:
  - Overview: index.md
  - Architecture:
      - Overview: architecture/index.md
      - Components: architecture/components.md
      - Offline Root CA: architecture/offline-root-ca.md
      - Online Intermediate CA: architecture/online-intermediate-ca.md
      - API Server: architecture/api-server.md
      - CLI Architecture: architecture/cli.md
      - OpenTelemetry: architecture/telemetry.md
      - Security Boundaries: architecture/trust-boundaries.md
      - Airgap-First: architecture/airgap.md
      - Diagrams: diagrams/index.md
  - Getting Started:
      - Quick Start: getting-started/quick-start.md
      - Setup Guide: getting-started/setup.md
  - Installation:
      - Binary: installation/binary.md
      - Podman: podman/index.md
      - Kubernetes: kubernetes/index.md
      - Helm Installation: kubernetes/helm-installation.md
      - Helm Values: kubernetes/values-reference.md
  - Configuration: configuration/index.md
  - CLI: cli/index.md
  - API: api/index.md
  - PKI Concepts: pki-concepts/index.md
  - Observability: observability/index.md
  - Security: security/index.md
  - Security Operations:
      - Bootstrap Guide: security/bootstrap-guide.md
      - Security Check: security/security-check.md
      - Offline Root Handling: security/offline-root-handling.md
      - Host Hardening: security/host-hardening.md
  - Migration: migration/index.md
  - Releases:
      - Helm Releases: release/helm-releases.md
  - Airgap:
      - Mirror Helm Chart: airgap/mirroring-helm-chart.md
  - Operations: operations/index.md
  - Development: development/index.md
  - Contributing: contributing/index.md
  - Roadmap: roadmap/index.md
