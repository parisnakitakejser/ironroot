name: Publish Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "deploy/helm/**"
      - "examples/**"
      - "docs/requirements.txt"
      - ".github/workflows/docs-website.yaml"

permissions:
  contents: write

concurrency:
  group: docs-website
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish website branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: make docs-deploy-local

      - name: Disable Jekyll for GitHub Pages
        run: touch site/.nojekyll

      - name: Publish generated site to website branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: website
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
          commit_message: "docs: publish website for ${{ github.sha }} [skip ci]"
